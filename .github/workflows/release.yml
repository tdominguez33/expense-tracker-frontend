name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Application with Tauri
        run: npm run tauri:build

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $tauriConfig = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $tauriConfig.version
          if (-not $version) { $version = "0.14.1" }

          $setupSource = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $setupAsset = "Expense-Tracker-v$version-build.${{ github.run_number }}-setup.exe"
          Copy-Item $setupSource.FullName $setupAsset

          $portableSource = "src-tauri/target/release/expense-tracker.exe"
          $portableAsset = "Expense-Tracker-v$version-build.${{ github.run_number }}-portable.exe"
          Copy-Item $portableSource $portableAsset

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "SETUP_ASSET=$setupAsset" >> $env:GITHUB_ENV
          "PORTABLE_ASSET=$portableAsset" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Expense Tracker v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.SETUP_ASSET }}
            ${{ env.PORTABLE_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
